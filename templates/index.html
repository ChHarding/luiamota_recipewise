<!-- ==================================================
HOME PAGE

Purpose:
Serves as the main entry point of RecipeWise. 
- Allows user to search for recipes by entering a recipe name.
- Retrieves marching recipes from TheMealDB API
- Displays recipe names, images, and country of origin 
- Each recipe name is a link to the Recipe Details page. 
================================================== -->

<!DOCTYPE html>

<html>
<head>
    <title>RecipeWise</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>


<body> 
    <nav>
        <a href="/">Home</a>
        <a href="/favorites">Favorites</a>
    </nav>

    <div class="hero">
        <img
            src="{{ url_for('static', filename='logo.svg') }}"
            alt="RecipeWise Logo"
            class="logo">

        <form class="search-form" method= "POST">
            <input 
            type="text" 
            name="recipe_name" 
            placeholder="Search for a recipe">
            
            <button 
            type="submit" 
            class="btn-primary"> 
            Search 
            </button>
        
        </form>
    </div>
    
    {% for meal in meals %}
        <div>   
            <h3>
                <a href="/recipe/{{meal["idMeal"]}}">
                    {{meal["strMeal"]}}
                </a>
            </h3>
            <img src="{{meal["strMealThumb"]}}" alt="{{meal["strMeal"]}}" width="200">
            <p> <b>Country:</b> {{meal["strArea"]}} </p>
        </div>
         <hr>
    {% endfor %}    

</body>
</html>
