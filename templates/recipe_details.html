<!-- ==================================================
RECIPE DETAILS PAGE

Purpose:
Displays detailed information of a selected recipe.
This page displays: 
- Recipe name
- Recipe image
- Recipe ingridients and measurments make_list
- Recipe instrunctions 
- Save Button (this feature allows users to save a recipe to their fav list)

================================================== -->
<!DOCTYPE html>
<html>
<header>
    <title>Recipe Details</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</header>

<body> 
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-logo-link">
                <img
                    src="{{ url_for('static', filename='logo.svg') }}"
                    alt="RecipeWise"
                    class="nav-logo">
            </a>
           <a href="/favorites" class="nav-link">
                <img
                    src="{{ url_for('static', filename='heart-full.svg')}}"
                    alt= "Favorites"
                    class = "nav-icon">
                Favorites
            </a>
    </nav>


    <h1>Recipe Details Page</h1>
    <h2> Recipe: {{recipe["strMeal"]}} </h2>
    <form action="/favorites/add//{{recipe["idMeal"]}}" method="POST">
        <button class="btn-primary" type="submit" > 
             <img 
                src = "{{ url_for ('static', filename='heart-empty.svg')}}"
                alt=" "
                class="button-icon">
            Add to Favorites 
        </button>
    </form>
    
    <img src="{{recipe["strMealThumb"]}}" alt="{{recipe["strMeal"]}}" width="200">
    <h3>Ingredients:</h3>
    <ul>
        {% for ingredient in ingredients %}
            <li>{{ ingredient }}</li>
        {% endfor %}
    </ul>

    <h3>Instructions:</h3>
        <ul>
        {% for step in instructions %}
            <li>{{ step }}</li>
        {% endfor %}
        </ul>
   
</body>
</html>
