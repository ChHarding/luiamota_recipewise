<!-- ==================================================
FAVORITES PAGE

Purpose:
Displays all recipes saved by the user. Each recipe
includes a name, image, and country of origin.
Users can click a recipe name to return to the
Recipe Details page.
================================================== -->

<!DOCTYPE html>
<!DOCTYPE html>
<html>
<header>
    <title>Favorites</title>
    <a href="/">Home</a> |
    <a href="/favorites">Favorites</a>
</header>
<body>
    <h1>My favorites recipes</h1>
    {% for recipe in favorites %}
        <div>
            <h3>
                <a href="/recipe/{{recipe["idMeal"]}}">
                    {{recipe["strMeal"]}} 
                </a>
            </h3>
            <img src="{{recipe["strMealThumb"]}}" alt="{{recipe["strMeal"]}}" width="200">
            <p><b>Country:</b> {{recipe["strArea"]}}</p>
        </div>
        <hr>
    {% endfor %}
    
    {% if message%}
        <p>{{message}}</p>
    {% endif %}

</body>
</html>
